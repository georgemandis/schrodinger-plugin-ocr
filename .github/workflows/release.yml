name: Release
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: macos-latest
            target: aarch64-apple-darwin
            platform: macos-arm64
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            platform: windows-x86_64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Build
        run: cargo build --release --target ${{ matrix.target }}

      - name: Package (unix)
        if: runner.os != 'Windows'
        run: |
          set -euo pipefail
          PLUGIN_ID=$(jq -r .id plugin.json)
          VERSION=$(jq -r .version plugin.json)
          mkdir -p staging/lib
          cp plugin.json staging/
          cp target/${{ matrix.target }}/release/*.dylib staging/lib/ 2>/dev/null || true
          cp target/${{ matrix.target }}/release/*.so staging/lib/ 2>/dev/null || true

          # Bundle libloupe (the loupe-rs build script emits it into the build
          # script's OUT_DIR under a non-deterministic hash dir, so glob for it).
          # Asked of cargo, because newer cargo keeps build scripts' output
          # outside target/.
          LOUPE_OUT=$(cargo build --release --target ${{ matrix.target }} --message-format=json 2>/dev/null | python3 -c '
          import json, sys
          for line in sys.stdin:
              try:
                  m = json.loads(line)
              except ValueError:
                  continue
              if m.get("reason") == "build-script-executed" and "loupe-rs" in m.get("package_id", ""):
                  print(m["out_dir"])
          ')
          LOUPE="$LOUPE_OUT/libloupe.dylib"
          if [ -f "$LOUPE" ]; then
            # Every plugin loads into the one Schrödinger process, and macOS
            # matches an already-loaded library by its install name. Under
            # the shared name "@rpath/libloupe.dylib" this plugin would be
            # handed whichever copy another plugin (Faces, Image) loaded
            # first, even an older one missing functions it needs. So this
            # copy gets its own name. Keep it short: loupe's library has no
            # spare header space, and a name more than two characters longer
            # than the original does not fit.
            LOUPE_NAME=loupe-ocr.dylib
            cp "$LOUPE" "staging/lib/$LOUPE_NAME"
            # Target the staged plugin dylib directly rather than reconstructing its name.
            PLUGIN_DYLIB=$(find staging/lib -name 'libschrodinger_plugin_*.dylib' | head -n1)
            install_name_tool -id "@rpath/$LOUPE_NAME" "staging/lib/$LOUPE_NAME"
            install_name_tool -change @rpath/libloupe.dylib "@rpath/$LOUPE_NAME" "$PLUGIN_DYLIB"
            install_name_tool -add_rpath @loader_path "$PLUGIN_DYLIB"
            # Editing a library invalidates its signature.
            codesign --force --sign - "staging/lib/$LOUPE_NAME" "$PLUGIN_DYLIB"
          else
            echo "ERROR: libloupe.dylib not found in build output" >&2
            exit 1
          fi

          cd staging
          tar czf ../${PLUGIN_ID}-${VERSION}-${{ matrix.platform }}.tar.gz .

      - name: Package (windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $json = Get-Content plugin.json | ConvertFrom-Json
          $id = $json.id
          $ver = $json.version
          New-Item -ItemType Directory -Force -Path staging/lib
          Copy-Item plugin.json staging/
          Copy-Item target/${{ matrix.target }}/release/*.dll staging/lib/

          # Bundle loupe.dll next to the plugin DLL (Windows resolves dependent
          # DLLs from the same directory, so no rpath is needed).
          # Asked of cargo, because newer cargo keeps build scripts' output
          # outside target/.
          $outDir = cargo build --release --target ${{ matrix.target }} --message-format=json 2>$null |
            ForEach-Object { try { $_ | ConvertFrom-Json } catch { } } |
            Where-Object { $_.reason -eq 'build-script-executed' -and $_.package_id -like '*loupe-rs*' } |
            Select-Object -First 1 -ExpandProperty out_dir
          $loupe = if ($outDir) { Get-Item (Join-Path $outDir 'loupe.dll') -ErrorAction SilentlyContinue } else { $null }
          if ($null -eq $loupe) {
            Write-Error "loupe.dll not found in build output"
            exit 1
          }
          Copy-Item $loupe.FullName staging/lib/

          cd staging
          tar czf ../${id}-${ver}-${{ matrix.platform }}.tar.gz .

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.platform }}
          path: "*.tar.gz"

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true

      - uses: softprops/action-gh-release@v2
        with:
          files: "*.tar.gz"
